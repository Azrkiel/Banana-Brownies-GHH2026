# Deploys GitHub main to the Fly app `signline-api` (API + web).
# Needs repo secret FLY_API_TOKEN: `fly tokens create deploy -a signline-api`.
name: Fly Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy-group
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --depot=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
